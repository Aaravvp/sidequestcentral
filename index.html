<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sidequest central</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function() {
            emailjs.init("YOUR_PUBLIC_KEY_HERE");
        })();
    </script>
    <style>
        :root {
            --brat-green: #8ACE00;
            --black: #000000;
            --white: #ffffff;
            --gray: #1a1a1a;
            --light-gray: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            text-transform: lowercase;
        }

        body {
            background-color: var(--brat-green);
            color: var(--black);
            padding: 25px 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 540px;
        }

        header { margin-bottom: 20px; }

        h1 {
            font-size: 3.4rem;
            font-weight: 900;
            letter-spacing: -2.5px;
            line-height: 0.85;
            filter: blur(0.4px);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: 800;
            background: var(--black);
            color: var(--brat-green);
            display: inline-block;
            padding: 4px 10px;
            letter-spacing: -0.5px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-main {
            background: var(--black);
            color: var(--brat-green);
            border: none;
            padding: 16px;
            font-size: 1.15rem;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            text-align: center;
            box-shadow: 4px 4px 0px var(--white);
            transition: all 0.1s ease;
        }

        .btn-main:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--white);
        }

        .filter-section-title {
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--black);
            margin-top: 4px;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: thin;
        }

        .chip {
            background: transparent;
            border: 2px solid var(--black);
            color: var(--black);
            padding: 5px 12px;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .chip.active {
            background: var(--black);
            color: var(--brat-green);
        }

        .chip.day-chip.active {
            background: var(--white);
            color: var(--black);
        }

        .quest-form {
            display: none;
            background: var(--black);
            color: var(--white);
            padding: 20px;
            margin-bottom: 25px;
            border: 2px solid var(--black);
            box-shadow: 6px 6px 0px var(--white);
        }

        .quest-form h3 {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--brat-green);
            margin-bottom: 15px;
            filter: blur(0.3px);
        }

        .input-group { margin-bottom: 12px; }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--brat-green);
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 10px;
            background: var(--gray);
            border: 1px solid #333;
            color: var(--white);
            font-size: 0.9rem;
            font-weight: 700;
            outline: none;
            color-scheme: dark;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row .input-group {
            flex: 1;
        }

        .feed {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: var(--black);
            color: var(--white);
            padding: 18px;
            border: 2px solid var(--black);
            box-shadow: 5px 5px 0px var(--white);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .card:hover { transform: translateY(-2px); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--brat-green);
            filter: blur(0.2px);
            line-height: 1.1;
        }

        .card-tag {
            background: var(--brat-green);
            color: var(--black);
            font-size: 0.7rem;
            font-weight: 900;
            padding: 2px 6px;
        }

        .card-meta {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .card-time-badge {
            color: var(--brat-green);
            font-weight: 800;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #222;
            padding-top: 12px;
        }

        .slots {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--brat-green);
        }

        .btn-join {
            background: var(--brat-green);
            color: var(--black);
            border: none;
            padding: 8px 14px;
            font-weight: 900;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.1s;
        }

        .btn-join.joined {
            background: #ffffff;
            color: var(--black);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal {
            background: var(--black);
            color: var(--white);
            border: 3px solid var(--brat-green);
            padding: 25px;
            width: 100%;
            max-width: 480px;
            box-shadow: 8px 8px 0px var(--brat-green);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--brat-green);
            color: var(--black);
            border: 2px solid var(--black);
            font-weight: 900;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.4rem;
            box-shadow: 3px 3px 0px var(--white);
            z-index: 20;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--brat-green);
            filter: blur(0.3px);
            margin-bottom: 10px;
            line-height: 1;
            padding-right: 50px;
        }

        .modal-section { margin-bottom: 18px; }

        .modal-label {
            font-size: 0.75rem;
            color: #777;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .modal-val {
            font-size: 1rem;
            font-weight: 700;
            color: var(--white);
        }

        .maps-link {
            display: inline-block;
            margin-top: 6px;
            background: var(--brat-green);
            color: var(--black);
            text-decoration: none;
            padding: 8px 12px;
            font-weight: 900;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>sidequest central</h1>
        <div class="subtitle">christ uni // who's outside right now?</div>
    </header>

    <div class="controls">
        <button class="btn-main" onclick="toggleForm()">+ drop a sidequest</button>

        <div class="filter-section-title">when:</div>
        <div class="filter-bar">
            <button class="chip day-chip active" onclick="setDayFilter('all', this)">all days</button>
            <button class="chip day-chip" onclick="setDayFilter('today', this)">today</button>
            <button class="chip day-chip" onclick="setDayFilter('tomorrow', this)">tomorrow</button>
            <button class="chip day-chip" onclick="setDayFilter('weekend', this)">this weekend</button>
        </div>

        <div class="filter-section-title">vibe:</div>
        <div class="filter-bar">
            <button class="chip cat-chip active" onclick="setCatFilter('all', this)">all</button>
            <button class="chip cat-chip" onclick="setCatFilter('cafe', this)">cafes</button>
            <button class="chip cat-chip" onclick="setCatFilter('lunch', this)">lunch</button>
            <button class="chip cat-chip" onclick="setCatFilter('brunch', this)">brunch</button>
            <button class="chip cat-chip" onclick="setCatFilter('dinner', this)">dinner</button>
            <button class="chip cat-chip" onclick="setCatFilter('shopping', this)">shopping</button>
            <button class="chip cat-chip" onclick="setCatFilter('walks', this)">walks</button>
            <button class="chip cat-chip" onclick="setCatFilter('hangs', this)">random hangs</button>
        </div>
    </div>

    <div class="quest-form" id="questForm">
        <h3>drop a quest</h3>
        <div class="input-group">
            <label>who are you?</label>
            <input type="text" id="questHost" placeholder="e.g. rahul (sem 2)">
        </div>
        <div class="input-group">
            <label>what are we doing?</label>
            <input type="text" id="questTitle" placeholder="e.g. third wave matcha run">
        </div>
        <div class="input-group">
            <label>where?</label>
            <input type="text" id="questLoc" placeholder="e.g. Third Wave Coffee, Koramangala">
        </div>
        <div class="input-row">
            <div class="input-group">
                <label>date</label>
                <input type="date" id="questDate">
            </div>
            <div class="input-group">
                <label>time</label>
                <input type="time" id="questTime">
            </div>
        </div>
        <div class="input-group">
            <label>category</label>
            <select id="questCat">
                <option value="cafe">cafe</option>
                <option value="lunch">lunch</option>
                <option value="brunch">brunch</option>
                <option value="dinner">dinner</option>
                <option value="shopping">shopping</option>
                <option value="walks">walks</option>
                <option value="hangs">random hangs</option>
            </select>
        </div>
        <div class="input-group">
            <label>the vibe / deets</label>
            <textarea id="questDeets" rows="2" placeholder="e.g. need to vent about internals & grab a matcha. chill only."></textarea>
        </div>
        <button class="btn-main" id="publishBtn" style="background: var(--brat-green); color: var(--black);" onclick="createQuest()">publish quest</button>
    </div>

    <div class="feed" id="questFeed"></div>
</div>

<!-- Onboarding Modal with OTP Step -->
<div class="modal-overlay" id="onboardingModal">
    <div class="modal">
        <button type="button" class="modal-close" onclick="closeOnboarding()">✕</button>
        <div class="modal-title">welcome to sidequest</div>
        <div style="font-size: 0.85rem; font-weight: 800; color: #888; margin-bottom: 20px;">
            christ uni access only // verify once to view details, post & join quests.
        </div>

        <!-- STEP 1: Details -->
        <div id="obStep1">
            <div class="input-group">
                <label>your name / handle</label>
                <input type="text" id="obName" placeholder="e.g. rahul">
            </div>
            <div class="input-group">
                <label>christ campus</label>
                <select id="obCampus">
                    <option value="Central Campus">central campus (koramangala)</option>
                    <option value="Kengeri Campus">kengeri campus</option>
                    <option value="BGR Campus">bgr campus (bannerghatta)</option>
                    <option value="Yeshwanthpur Campus">yeshwanthpur campus</option>
                    <option value="Delhi NCR Campus">delhi ncr campus</option>
                    <option value="Lavasa Campus">lavasa campus</option>
                </select>
            </div>
            <div class="input-group">
                <label>year / course</label>
                <input type="text" id="obYear" placeholder="e.g. 1st yr MCA or 2nd yr BBA">
            </div>
            <div class="input-group">
                <label>christ uni email (@...christuniversity.in)</label>
                <input type="email" id="obEmail" placeholder="e.g. name@mca.christuniversity.in">
            </div>
            <button class="btn-main" style="background: var(--brat-green); color: var(--black); margin-top: 15px;" id="sendOtpBtn" onclick="sendOTP()">send otp code</button>
        </div>

        <!-- STEP 2: OTP Entry -->
        <div id="obStep2" style="display: none;">
            <div class="input-group">
                <label>enter 6-digit otp sent to your email</label>
                <input type="text" id="obOtpInput" maxlength="6" placeholder="e.g. 482019" style="letter-spacing: 4px; font-size: 1.2rem; text-align: center;">
            </div>
            <button class="btn-main" style="background: var(--brat-green); color: var(--black); margin-top: 15px;" onclick="verifyOTP()">verify & unlock</button>
            <button class="btn-main" style="background: transparent; color: #888; border: 1px solid #333; margin-top: 8px; font-size: 0.8rem;" onclick="backToStep1()">← change details</button>
        </div>
    </div>
</div>

<!-- Quest Detail Modal -->
<div class="modal-overlay" id="detailModal">
    <div class="modal">
        <button type="button" class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-title" id="mTitle"></div>
        <div class="modal-section">
            <div class="modal-label">host & time</div>
            <div class="modal-val" id="mHostTime"></div>
        </div>
        <div class="modal-section">
            <div class="modal-label">the vibe / details</div>
            <div class="modal-val" id="mDeets"></div>
        </div>
        <div class="modal-section">
            <div class="modal-label">location</div>
            <div class="modal-val" id="mLoc"></div>
            <a href="#" target="_blank" class="maps-link" id="mMapsBtn">📍 open in google maps</a>
        </div>
        <div class="modal-section">
            <div class="modal-label">attendance</div>
            <div class="modal-val" id="mSlots" style="color: var(--brat-green);"></div>
        </div>
        <button class="btn-main" id="mJoinBtn" style="background: var(--brat-green); color: var(--black); margin-top: 10px;">i'm down</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDSh3SBYbK1OHTnU05aVRBL-DqcqX6HeOI",
        authDomain: "side-quest-b4cd8.firebaseapp.com",
        projectId: "side-quest-b4cd8",
        storageBucket: "side-quest-b4cd8.firebasestorage.app",
        messagingSenderId: "438055949671",
        appId: "1:438055949671:web:6f097348437a1e3fef8bc2",
        measurementId: "G-25XTGYVQ8X"
    };

    firebase.initializeApp(firebaseConfig);
    
    // Explicitly target your custom database 'sidequestcentral'
    const db = firebase.app().firestore("sidequestcentral");
    const questsRef = db.collection("sidequests");

    let myUserId = localStorage.getItem('sq_user_id');
    if (!myUserId) {
        myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('sq_user_id', myUserId);
    }

    let pendingActionAfterOnboarding = null;
    let quests = [];
    let activeCat = 'all';
    let activeDay = 'all';
    let generatedOTP = null;
    let otpExpiryTime = null;

    function isValidChristEmail(email) {
        const christRegex = /^[a-zA-Z0-9._%+-]+@([a-zA-Z0-9.-]+\.)?christuniversity\.in$/i;
        return christRegex.test(email.trim());
    }

    function isValidName(name) {
        return name.trim().length >= 2;
    }

    function isValidCourseYear(year) {
        return year.trim().length >= 2;
    }

    function isOnboarded() {
        const email = localStorage.getItem('sq_user_email');
        const name = localStorage.getItem('sq_user_name');
        return email && isValidChristEmail(email) && name && isValidName(name);
    }

    function requireOnboarding(actionCallback) {
        if (isOnboarded()) {
            if (actionCallback) actionCallback();
            return true;
        }
        pendingActionAfterOnboarding = actionCallback || null;
        document.getElementById('onboardingModal').style.display = 'flex';
        return false;
    }

    async function sendOTP() {
        const name = document.getElementById('obName').value.trim();
        const year = document.getElementById('obYear').value.trim();
        const email = document.getElementById('obEmail').value.trim();

        if (!isValidName(name)) return alert('please enter a valid name!');
        if (!isValidCourseYear(year)) return alert('please enter a valid year/course!');
        if (!isValidChristEmail(email)) return alert('must be a valid christ university email!');

        const btn = document.getElementById('sendOtpBtn');
        btn.innerText = 'sending otp...';
        btn.disabled = true;

        generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
        otpExpiryTime = Date.now() + (10 * 60 * 1000);

        const templateParams = {
            to_email: email.toLowerCase(),
            to_name: name,
            otp_code: generatedOTP
        };

        try {
            await emailjs.send('YOUR_SERVICE_ID_HERE', 'YOUR_TEMPLATE_ID_HERE', templateParams);
            alert(`otp sent to ${email}! check your inbox or spam folder.`);
            
            document.getElementById('obStep1').style.display = 'none';
            document.getElementById('obStep2').style.display = 'block';
        } catch (error) {
            console.error('EmailJS Error:', error);
            alert(`[DEV MODE TEST] Your OTP code is: ${generatedOTP}`);
            document.getElementById('obStep1').style.display = 'none';
            document.getElementById('obStep2').style.display = 'block';
        } finally {
            btn.innerText = 'send otp code';
            btn.disabled = false;
        }
    }

    function verifyOTP() {
        const userInputOTP = document.getElementById('obOtpInput').value.trim();

        if (!userInputOTP) return alert('please enter the otp code!');
        if (Date.now() > otpExpiryTime) return alert('otp expired! please go back and request a new code.');

        if (userInputOTP === generatedOTP) {
            completeOnboarding();
        } else {
            alert('incorrect otp code! please check your email again.');
        }
    }

    function backToStep1() {
        document.getElementById('obStep1').style.display = 'block';
        document.getElementById('obStep2').style.display = 'none';
    }

    function completeOnboarding() {
        const name = document.getElementById('obName').value.trim();
        const campus = document.getElementById('obCampus').value;
        const year = document.getElementById('obYear').value.trim();
        const email = document.getElementById('obEmail').value.trim();

        localStorage.setItem('sq_user_name', name);
        localStorage.setItem('sq_user_campus', campus);
        localStorage.setItem('sq_user_year', year);
        localStorage.setItem('sq_user_email', email.toLowerCase());

        document.getElementById('onboardingModal').style.display = 'none';

        if (pendingActionAfterOnboarding) {
            const action = pendingActionAfterOnboarding;
            pendingActionAfterOnboarding = null;
            action();
        }
    }

    function closeOnboarding() {
        document.getElementById('onboardingModal').style.display = 'none';
        pendingActionAfterOnboarding = null;
    }

    questsRef.onSnapshot((snapshot) => {
        quests = [];
        snapshot.forEach((doc) => {
            const data = doc.data();
            quests.push({
                id: doc.id,
                ...data,
                joinedByMe: Array.isArray(data.joinedUsers) && data.joinedUsers.includes(myUserId)
            });
        });
        renderFeed();
    }, (error) => {
        console.error("Firestore snapshot error:", error);
    });

    function formatTime12hr(timeStr) {
        const [h, m] = timeStr.split(':').map(Number);
        const ampm = h >= 12 ? 'pm' : 'am';
        const hour12 = h % 12 || 12;
        const minStr = m < 10 ? `0${m}` : m;
        return `${hour12}:${minStr} ${ampm}`;
    }

    function getQuestTimestamp(q) {
        if (q.isoDateTime) {
            const dateObj = new Date(q.isoDateTime);
            if (!isNaN(dateObj.getTime())) return dateObj;
        }
        return new Date(2099, 11, 31);
    }

    function checkScheduleClash(targetTimestamp) {
        const targetTime = targetTimestamp.getTime();
        const duration = 90 * 60 * 1000;
        for (let q of quests) {
            if (q.joinedByMe) {
                const qTime = getQuestTimestamp(q).getTime();
                if (Math.abs(targetTime - qTime) < duration) return q;
            }
        }
        return null;
    }

    function setDefaultFormDate() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        document.getElementById('questDate').value = `${year}-${month}-${day}`;

        let hours = now.getHours() + 1;
        if (hours >= 24) hours = 23;
        const hoursStr = String(hours).padStart(2, '0');
        document.getElementById('questTime').value = `${hoursStr}:00`;
    }

    function renderFeed() {
        const feed = document.getElementById('questFeed');
        feed.innerHTML = '';
        const now = new Date();

        let filtered = quests.filter(q => {
            const qDate = getQuestTimestamp(q);
            if (qDate < new Date(now.getTime() - (2 * 60 * 60 * 1000))) return false;
            if (activeCat !== 'all' && q.cat !== activeCat) return false;

            const isSameDay = (d1, d2) => d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
            const tomorrow = new Date(now);
            tomorrow.setDate(now.getDate() + 1);

            if (activeDay === 'today') return isSameDay(qDate, now);
            if (activeDay === 'tomorrow') return isSameDay(qDate, tomorrow);
            if (activeDay === 'weekend') {
                const day = qDate.getDay();
                return day === 0 || day === 6;
            }

            return true;
        });

        filtered.sort((a, b) => getQuestTimestamp(a) - getQuestTimestamp(b));

        if (filtered.length === 0) {
            feed.innerHTML = `<div style="text-align:center; font-weight:900; padding:40px 10px; font-size:1.2rem;">no sidequests live yet.<br><span style="font-size:0.9rem; font-weight:700;">be the first to drop one above.</span></div>`;
            return;
        }

        filtered.forEach(q => {
            feed.innerHTML += `
                <div class="card" onclick="openModal('${q.id}')">
                    <div class="card-header">
                        <div class="card-title">${q.title}</div>
                        <span class="card-tag">${q.cat}</span>
                    </div>
                    <div class="card-meta">
                        <span class="card-time-badge">🕒 ${q.time}</span>
                        <span>📍 ${q.loc.split(',')[0]}</span>
                        <span>👤 ${q.host}</span>
                    </div>
                    <div class="card-footer">
                        <span class="slots">${q.joinedCount || 1} down</span>
                        <button class="btn-join ${q.joinedByMe ? 'joined' : ''}" 
                                onclick="event.stopPropagation(); toggleJoinQuest('${q.id}')">
                            ${q.joinedByMe ? 'you\'re down ✓' : 'i\'m down'}
                        </button>
                    </div>
                </div>
            `;
        });
    }

    function showModalContent(id) {
        const q = quests.find(item => item.id === id);
        if(!q) return;

        document.getElementById('mTitle').innerText = q.title;
        document.getElementById('mHostTime').innerText = `${q.host} • ${q.time}`;
        document.getElementById('mDeets').innerText = q.deets || "no extra details provided. just pull up.";
        document.getElementById('mLoc').innerText = q.loc;
        document.getElementById('mSlots').innerText = `${q.joinedCount || 1} ${(q.joinedCount === 1) ? 'person' : 'people'} down so far`;
        document.getElementById('mMapsBtn').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q.loc)}`;

        const joinBtn = document.getElementById('mJoinBtn');
        joinBtn.innerText = q.joinedByMe ? "you're down ✓ (tap to leave)" : "i'm down";
        joinBtn.style.background = q.joinedByMe ? "#ffffff" : "var(--brat-green)";
        joinBtn.onclick = () => { toggleJoinQuest(q.id); closeModal(); };

        document.getElementById('detailModal').style.display = 'flex';
    }

    function openModal(id) {
        requireOnboarding(() => showModalContent(id));
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
    
    function toggleForm() {
        requireOnboarding(() => {
            const form = document.getElementById('questForm');
            const isOpening = form.style.display !== 'block';
            form.style.display = isOpening ? 'block' : 'none';
            if (isOpening) {
                setDefaultFormDate();
                if (localStorage.getItem('sq_user_name')) {
                    document.getElementById('questHost').value = `${localStorage.getItem('sq_user_name')} (${localStorage.getItem('sq_user_year')})`;
                }
            }
        });
    }

    async function createQuest() {
        if (!requireOnboarding()) return;

        const hostInput = document.getElementById('questHost').value.trim();
        const title = document.getElementById('questTitle').value.trim();
        const loc = document.getElementById('questLoc').value.trim();
        const dateInput = document.getElementById('questDate').value;
        const timeInput = document.getElementById('questTime').value;
        const deets = document.getElementById('questDeets').value.trim();
        const cat = document.getElementById('questCat').value;

        if (!hostInput || !title || !loc || !dateInput || !timeInput) {
            return alert('please fill out all required fields!');
        }

        const targetDate = new Date(`${dateInput}T${timeInput}`);
        const now = new Date();
        if (isNaN(targetDate.getTime())) return alert('invalid date or time selected!');

        const isSameDay = (d1, d2) => d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
        const tomorrow = new Date(now);
        tomorrow.setDate(now.getDate() + 1);

        let dayPrefix = '';
        if (isSameDay(targetDate, now)) {
            dayPrefix = 'today @ ';
        } else if (isSameDay(targetDate, tomorrow)) {
            dayPrefix = 'tomorrow @ ';
        } else {
            const options = { month: 'short', day: 'numeric' };
            dayPrefix = `${targetDate.toLocaleDateString('en-US', options).toLowerCase()} @ `;
        }

        const displayTime = `${dayPrefix}${formatTime12hr(timeInput)}`;

        // Instantly hide form & clear fields
        document.getElementById('questForm').style.display = 'none';
        document.getElementById('questTitle').value = '';
        document.getElementById('questLoc').value = '';
        document.getElementById('questDeets').value = '';

        // Save to Database in background
        try {
            await questsRef.add({
                title: title.toLowerCase(),
                loc: loc,
                time: displayTime,
                isoDateTime: targetDate.toISOString(),
                deets: deets.toLowerCase(),
                cat: cat,
                joinedCount: 1,
                joinedUsers: [myUserId],
                host: hostInput.toLowerCase(),
                userEmail: localStorage.getItem('sq_user_email') || '',
                campus: localStorage.getItem('sq_user_campus') || '',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        } catch (err) {
            console.error("Publishing error:", err);
            alert(`Failed to sync to database: ${err.message}`);
        }
    }

    async function executeToggleJoin(id) {
        const quest = quests.find(q => q.id === id);
        if (!quest) return;
        const docRef = questsRef.doc(id);

        try {
            if (quest.joinedByMe) {
                await docRef.update({
                    joinedUsers: firebase.firestore.FieldValue.arrayRemove(myUserId),
                    joinedCount: firebase.firestore.FieldValue.increment(-1)
                });
            } else {
                await docRef.update({
                    joinedUsers: firebase.firestore.FieldValue.arrayUnion(myUserId),
                    joinedCount: firebase.firestore.FieldValue.increment(1)
                });
            }
        } catch (err) {
            console.error("Join toggle error:", err);
            alert(`action failed: ${err.message}`);
        }
    }

    async function toggleJoinQuest(id) {
        requireOnboarding(() => executeToggleJoin(id));
    }

    function setCatFilter(cat, btn) {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        activeCat = cat;
        renderFeed();
    }

    function setDayFilter(day, btn) {
        document.querySelectorAll('.day-chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        activeDay = day;
        renderFeed();
    }

    window.onclick = function(event) {
        if (event.target === document.getElementById('detailModal')) closeModal();
        if (event.target === document.getElementById('onboardingModal')) closeOnboarding();
    }
</script>

</body>
</html>
